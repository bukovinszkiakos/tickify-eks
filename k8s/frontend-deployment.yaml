apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickify-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tickify-frontend
  template:
    metadata:
      labels:
        app: tickify-frontend
    spec:
      containers:
        - name: frontend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          env:
            - name: BACKEND_URL
              value: "http://tickify-service:80"

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
