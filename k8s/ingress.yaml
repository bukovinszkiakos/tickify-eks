apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tickify-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tickify-service
                port:
                  number: 80
          - path: /Auth
            pathType: Prefix
            backend:
              service:
                name: tickify-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tickify-frontend-service
                port:
                  number: 80
