apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickify-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tickify-backend
  template:
    metadata:
      labels:
        app: tickify-backend
    spec:
      serviceAccountName: tickify-sa

      containers:
        - name: backend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          # AI modernization: enforce non-root at the Kubernetes level, consistent with USER app in Dockerfile
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"

          # AI modernization: readiness probe uses /health (real DB check) — prevents traffic during startup/migrations
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          # AI modernization: liveness probe restarts stuck pods — generous delay accounts for slow cold starts
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: ConnectionStrings__DefaultConnection

            - name: Jwt__IssuerSigningKey
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: Jwt__IssuerSigningKey

            - name: Jwt__ValidIssuer
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: Jwt__ValidIssuer

            - name: Jwt__ValidAudience
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: Jwt__ValidAudience

            # AI modernization: required by RoleSeeder — throws InvalidOperationException at startup if missing
            - name: SEEDING__ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: SEEDING__ADMINPASSWORD

            - name: SEEDING__SUPERADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: SEEDING__SUPERADMINPASSWORD

            # AI modernization: required by S3FileStorageService — throws InvalidOperationException at startup if missing
            - name: AWS__BucketName
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: AWS__BucketName

            - name: COOKIE__SECURE
              value: "false"
