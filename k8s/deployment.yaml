apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickify-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tickify-backend
  template:
    metadata:
      labels:
        app: tickify-backend
    spec:
      serviceAccountName: tickify-sa

      containers:
        - name: backend
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: ConnectionStrings__DefaultConnection

            - name: Jwt__IssuerSigningKey
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: Jwt__IssuerSigningKey

            - name: Jwt__ValidIssuer
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: Jwt__ValidIssuer

            - name: Jwt__ValidAudience
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: Jwt__ValidAudience

            - name: SEEDING__ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: SEEDING__ADMINPASSWORD

            - name: SEEDING__SUPERADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: SEEDING__SUPERADMINPASSWORD

            - name: AWS__BucketName
              valueFrom:
                secretKeyRef:
                  name: tickify-secret
                  key: AWS__BucketName

            - name: COOKIE__SECURE
              value: "false"
